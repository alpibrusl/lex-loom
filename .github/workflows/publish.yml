name: Publish to lex-hub

# Publishes on a TAG, not on every push to main.
#
# The implementation is the shared reusable workflow in lex-hub, so a fix to
# the publish pipeline lands once for every package repo -- the reason it was
# centralised (see its own header: the version-string gate that silently
# no-op'd for months was one bug copied into every repo's private copy).
#
# The TRIGGER stays here, and it is a tag on purpose. The shared workflow's
# other callers run it on every push to main; measured on lex-schema's runs,
# that republishes an already-published version, which does not no-op -- it
# returns 409 after roughly an hour -- and every version bump made to avoid
# the 409 is a commit that drifts every downstream consumer (three red builds
# fleet-wide on 2026-09-11 from one-line bumps). A tag makes a release a
# deliberate act: bump `version` in lex.toml, tag v<version>, push the tag.
# Nothing publishes by accident, main never goes red for lacking a bump, and
# consumers drift once per release rather than once per merge.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    uses: alpibrusl/lex-hub/.github/workflows/lex-publish.yml@main
    secrets:
      LEXHUB_ADMIN_SECRET: ${{ secrets.LEXHUB_ADMIN_SECRET }}
