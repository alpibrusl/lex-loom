name: Publish to lex-hub
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # Publishes on a TAG, not on every push to main.
      #
      # There used to be a version-string gate here (run only when lex.toml's
      # `version` changed between commits). It silently no-op'd every push for
      # months: nothing bumps `version` routinely, so the job reported success
      # in 9 seconds having published nothing. lex-schema#38 removed the same
      # gate and published on every push instead -- and measured on its runs,
      # that is the wrong fix: republishing an already-published version does
      # not no-op, it returns 409 after roughly an hour, so every push without
      # a version bump went red; and every version bump is a commit that
      # drifts every downstream consumer (three red builds fleet-wide on one
      # day, 2026-09-11, each from a one-line lex-schema bump).
      #
      # A tag makes a release a deliberate act: bump `version` in lex.toml,
      # tag it v<version>, push the tag. Nothing publishes by accident, main
      # never goes red for lacking a bump, and consumers drift once per
      # release rather than once per merge. A publish still takes 26-62
      # minutes (a lex-hub problem, not this workflow's), so it should not be
      # something every merge triggers.

      - name: Install lex
        run: |
          curl -fsSL "https://github.com/alpibrusl/lex-lang/releases/download/v0.11.5/lex-v0.11.5-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin

      - name: Mint JWT + publish
        env:
          LEXHUB_ADMIN_SECRET: ${{ secrets.LEXHUB_ADMIN_SECRET }}
        run: |
          JWT=$(curl -sf -X POST https://vcs.lexlang.org/v1/admin/mint \
            -H "Authorization: Bearer $LEXHUB_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"tenant_id":"alpibrusl","ttl_secs":3600}' | jq -r .token)
          lex pkg publish --registry https://vcs.lexlang.org --token "$JWT"

      - name: Set visibility public
        env:
          LEXHUB_ADMIN_SECRET: ${{ secrets.LEXHUB_ADMIN_SECRET }}
        run: |
          JWT=$(curl -sf -X POST https://vcs.lexlang.org/v1/admin/mint \
            -H "Authorization: Bearer $LEXHUB_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"tenant_id":"alpibrusl","ttl_secs":300}' | jq -r .token)
          PKG=$(grep -m1 '^name' lex.toml | sed 's/.*= *"\(.*\)"/\1/')
          curl -sf -X PUT "https://vcs.lexlang.org/v1/pkg/${PKG}/visibility" \
            -H "Authorization: Bearer $JWT" \
            -H "Content-Type: application/json" \
            -d '{"visibility":"public"}' || true
