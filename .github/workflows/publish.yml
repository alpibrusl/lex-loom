name: Publish to lex-hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      # No version-string gate here on purpose. There used to be one, keyed off
      # whether lex.toml's `version` changed between commits, and it silently
      # no-op'd every push: real commits land without touching `version`, so it
      # always evaluated false while the job still reported success in under
      # 10s. lex-schema#38 removed the identical gate first; this is the
      # follow-up that PR called for.
      #
      # Note what removing it actually buys, measured on lex-schema's runs
      # rather than assumed: a publish of an ALREADY-published version does not
      # no-op, it returns 409 after roughly an hour, and every publish run --
      # success or failure -- takes 26 to 62 minutes. So this workflow is now
      # honest but slow, and it will go red on any push to main that does not
      # bump the version. Bump `version` in the same PR as any change you want
      # published. (lex-schema#38 claimed republishing was "safe and
      # idempotent" because the store is content-addressed; the 409s show that
      # is not what the registry does.)

      - name: Install lex
        run: |
          curl -fsSL "https://github.com/alpibrusl/lex-lang/releases/download/v0.11.5/lex-v0.11.5-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin

      - name: Mint JWT + publish
        env:
          LEXHUB_ADMIN_SECRET: ${{ secrets.LEXHUB_ADMIN_SECRET }}
        run: |
          JWT=$(curl -sf -X POST https://vcs.lexlang.org/v1/admin/mint \
            -H "Authorization: Bearer $LEXHUB_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"tenant_id":"alpibrusl","ttl_secs":3600}' | jq -r .token)
          lex pkg publish --registry https://vcs.lexlang.org --token "$JWT"

      - name: Set visibility public
        env:
          LEXHUB_ADMIN_SECRET: ${{ secrets.LEXHUB_ADMIN_SECRET }}
        run: |
          JWT=$(curl -sf -X POST https://vcs.lexlang.org/v1/admin/mint \
            -H "Authorization: Bearer $LEXHUB_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"tenant_id":"alpibrusl","ttl_secs":300}' | jq -r .token)
          PKG=$(grep -m1 '^name' lex.toml | sed 's/.*= *"\(.*\)"/\1/')
          curl -sf -X PUT "https://vcs.lexlang.org/v1/pkg/${PKG}/visibility" \
            -H "Authorization: Bearer $JWT" \
            -H "Content-Type: application/json" \
            -d '{"visibility":"public"}' || true
