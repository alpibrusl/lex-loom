services:
  lex-loom:
    image: lex-loom:latest
    ports:
      - "8880:8880"
    volumes:
      - loom_data:/data
    environment:
      PORT: "8880"
      DB_PATH: /data/loom.db
      WEB_DIR: /app/src/web
      MODEL: "gemini-3.5-flash"
      VERTEX_ACCESS_TOKEN: "${VERTEX_ACCESS_TOKEN}"
      VERTEX_PROJECT: "${VERTEX_PROJECT}"
      VERTEX_LOCATION: "eu"

volumes:
  loom_data:
