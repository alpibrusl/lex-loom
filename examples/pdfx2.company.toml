# pdfx2: metered PDF-to-text extraction API for AI agents, priced per call
# via x402 (no subscription, no API key signup). A clean re-run of the pdfx
# experiment (examples/pdfx.company.toml) under three loom fixes that came
# directly out of reviewing that first run's real output:
#   - #105: build artifacts synced by the sprint graph's real node role, not
#     a node_id substring guess.
#   - #106: the Strategist gets a ground-truth LEX BUILD STATUS signal
#     instead of trusting its own read of "mission achieved"; missing-Python-
#     dependency failures get an explicit [MISSING_DEPENDENCY] marker instead
#     of silently being worked around.
#   - #108: bootstrap-company.sh warns (for free, before any spend) if the
#     mission names a Python package outside py_build's real whitelist.
# This mission is deliberately corrected from the original (which named
# pdfplumber -- exactly the package #108's new check would now flag) to a
# stdlib-only approach, matching what the sandbox can actually deliver, and
# drops the "extract tables" scope since that's not realistic for a
# hand-rolled parser and wasn't properly validated in the first run either.
# A fresh company id (not resuming "pdfx") is used so the Strategist starts
# with a clean SHIPPED SO FAR / sprint_graphs history -- the point is to
# observe the fixed behavior from a real iteration 1, not to re-run history
# that already baked in the old mistakes.
#
# Field status:  [enforced] acted on today  ·  [declared-intent] recorded, realized as bootstrap/deploy wiring lands.

[identity]
id      = "pdfx2"                                              # [enforced] → COMPANY_ID + workspace dir
name    = "pdfx2"
mission = "Build pdfx2: a metered PDF-to-text extraction API for AI agents, priced per call via x402 (no subscription, no API key signup). Lex HTTP server (lex-x402-api golden path): GET /health is free. POST /extract is behind the x402 payment gate -- accepts a PDF (base64-encoded in the JSON body), shells out to a bundled Python helper script via std.proc to extract plain text per page, returns JSON {page_count, pages: [{text}]}. The Python helper MUST use only Python's standard library (no pip-installed packages -- the sandbox has no package-install step; a hand-rolled parser is the correct, expected approach, not a workaround). Digital-text PDFs only: a scanned/image-only PDF (no extractable text layer) returns a clear 422 {\"error\":\"not_text_based\"} rather than attempting OCR -- keep the Docker image lean and every call fast and cheap. Stateless: no uploaded PDF content or extracted output is persisted anywhere after the request completes -- state this explicitly in a short privacy note the /health response links to. Tests: the free health route; the Python extraction helper directly (a real multi-page text PDF, a corrupted/non-PDF input, and a scanned-image-only PDF each producing the expected shape or the 422 case); the x402 gate's unpaid-402/paid-200 behavior (reuse payments.lex's existing test pattern, never hand-roll the handshake); the priced /extract endpoint itself must call the Python helper and be gated by pay.gate -- this is the one thing the first pdfx run never actually built in 9 iterations, so it is the mission's core deliverable, not an optional extra."   # [enforced] → GOAL

[stack]
path  = "lex-x402-api"        # [enforced] → the only vetted path with a real, tested x402 payment gate (lex-x402/lex-guard are Lex-only, so the priced route must be a Lex server); PDF parsing itself shells out to a bundled Python helper via std.proc, not a second HTTP server
model = "kimi-k2.7-code"      # [enforced] → MODEL -- confirmed live (pdfx run) to reliably complete real tool calls where glm-5.2 blew its token budget on reasoning; flat OpenCode Go subscription, so real financial risk is bounded (worst case is 429 rate-limiting, not open-ended billing)
storage = "none"              # [declared-intent] stateless by design -- no PDF content or output is retained after a request

[infra]
# repo/hosting/domain intentionally left unset for v1: no GitHub repo requested
# yet, and no Hetzner server is provisioned -- this run builds, QA's, and
# launches LOCALLY only (no deploy node in the sprint graph).

[roles]
packs = ["engineering", "legal"]   # [enforced] engineering builds it; legal drafts the short "we don't store your PDFs" privacy note /health links to (a real, human-review-required draft, not a final policy) -- no distribution/finance packs yet: an agent-consumed API has no human marketing funnel, and pricing is fixed directly via the x402 gate's env config, not a finance workstream

[monitoring]
checks = ["liveness"]         # [enforced] liveness is live (OP1); error_rate/usage are [declared-intent] but real for production deploys (#101/#102) once this is actually deployed

[policy]
max_iterations = 12           # [enforced] → MAX_ITERATIONS
budget_eur     = 50            # [enforced] → STOP_WHEN="spend ge 50.00" -- deliberately tight this run (vs the first run's $300 ceiling) so we check in early rather than letting a bad run go far; flat OpenCode Go subscription bounds real risk to rate-limiting regardless
human_gates    = ["payments", "go-public", "app-store"]   # [declared-intent] via lex-os-manifest grants -- unchanged defaults; go-public covers actually listing on Agent.market, a real human step regardless of how the product is built
